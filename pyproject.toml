[project]
name = "fhir-mcp-server"
version = "0.1.0"
description = "Servidor MCP mínimo sobre FHIR (SDK oficial de Python v2)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "inline-snapshot>=0.35",
]

[tool.pytest.ini_options]
testpaths = ["."]
