name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          uv venv
          uv pip install "mcp[cli]" httpx pytest inline-snapshot
      - name: Run unit tests
        run: uv run pytest -v -k "not servidor_real"
